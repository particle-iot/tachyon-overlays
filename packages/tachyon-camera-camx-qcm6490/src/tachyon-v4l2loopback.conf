# Parameters for the loopback node the CamX bridge writes into.
#
# exclusive_caps=1 is the only value that works: with 0 the capture side
# advertises no formats at all and ffmpeg fails with VIDIOC_G_FMT: Invalid
# argument. It also makes the node report OUTPUT-only until the first frame is
# written, which is why consumers must open it after the bridge is streaming,
# not merely after the service has started.
#
# video_nr=-1 lets the kernel pick. A fixed number collides with the iris and
# CamX nodes, whose numbering shifts when either subsystem is added or removed.
# The stable name is the udev symlink instead.
options v4l2loopback devices=1 video_nr=-1 exclusive_caps=1 card_label="Tachyon CamX Bridge"
