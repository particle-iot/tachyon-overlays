# Keep the camera's log volume off the flash.
#
# This exists because of CamX. Even with its own logging turned down in
# camxoverridesettings.txt, the HAL is a talkative component and the defaults
# here make every line cost twice: journald writes it, then rsyslog writes it
# again through ForwardToSyslog. On this board that stream reached 4 GB of
# journal and a 12 GB /var/log/syslog in normal use.
[Journal]

# rsyslog adds a second copy of every line to /var/log/syslog and buys nothing
# here - journalctl already has it, and nothing on this image reads syslog.
ForwardToSyslog=no

# Left unbounded the journal grew to 4 GB.
SystemMaxUse=500M
SystemMaxFileSize=50M

# A talkative unit should not be able to drown the log. Anything over the burst
# is dropped with a "Suppressed N messages" marker, so suppression stays
# visible rather than silent.
#
# Note this limits what gets stored, not what gets sent: journald still
# receives and evaluates every message, so this bounds disk use rather than
# CPU. Cutting the CPU cost has to happen at the source.
RateLimitIntervalSec=10s
RateLimitBurst=300
